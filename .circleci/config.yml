version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Random pass/fail"
          command: |
            echo "Failing this run."
            exit 0
      - run:
          name: Post comment to GitHub PR
          command: |
            set -euo pipefail

            sudo apt-get update
            sudo apt-get install -y jq

            # Prefer CircleCI-provided PR URL(s)
            pr_url="${CIRCLE_PULL_REQUEST:-}"
            if [[ -z "$pr_url" && -n "${CIRCLE_PULL_REQUESTS:-}" ]]; then
              pr_url="$(echo "$CIRCLE_PULL_REQUESTS" | cut -d',' -f1)"
            fi

            if [[ -z "$pr_url" ]]; then
              echo "Not a PR build (CIRCLE_PULL_REQUEST(S) is empty). Skipping."
              exit 0
            fi

            pr_number="${pr_url##*/}"
            owner="${CIRCLE_PROJECT_USERNAME}"
            repo="${CIRCLE_PROJECT_REPONAME}"

            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "GH_TOKEN is not set. Skipping."
              exit 0
            fi

            comments_url="https://api.github.com/repos/${owner}/${repo}/issues/${pr_number}/comments"
            payload="$(jq -n --arg body "My amazing comment" '{body: $body}')"

            echo "Posting comment to PR #${pr_number} ..."
            resp="$(
              curl -sS -L -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "$comments_url"
            )"

            # If GitHub returned an error object, show it clearly.
            if [[ "$(echo "$resp" | jq -r 'has("message")')" == "true" ]]; then
              echo "GitHub API error:"
              echo "$resp" | jq .
              exit 1
            fi

            echo "Comment posted."

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
