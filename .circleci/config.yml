version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Random pass/fail"
          command: |
            echo "Failing this run."
            exit 1
  dummy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Dummy pass"
          command: echo "Dummy job passed."

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - approve-failure:
          type: approval
          requires:
            - say-hello: failed
      - dummy:
          name: dummy-pass
          requires:
            - approve-failure: success
