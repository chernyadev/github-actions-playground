version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Random pass/fail"
          command: |
            echo "Failing this run."
            exit 0

  approve-auto:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Auto approve"
          command: |
            echo "Auto approved."

  gate:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Final gate"
          command: |
            echo "Gate passed."

workflows:
  say-hello-workflow:
    jobs:
      - say-hello

      - approve-failure:
          type: approval
          requires:
            - say-hello: failed

      - approve-auto:
          requires:
            - say-hello: success

      - gate:
          requires:
            - approve-auto
            - approve-failure
          filters:
            branches:
              only: master
