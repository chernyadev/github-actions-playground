version: 2.1

orbs:
  github-cli: circleci/github-cli@2.7.2

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Random pass/fail"
          command: |
            echo "Failing this run."
            exit 0
      - github-cli/setup:
          token: GH_TOKEN

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
